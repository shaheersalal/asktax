name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, Shaheer]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ --ignore E501,F401

      - name: Verify imports
        run: python -c "import ast, pathlib; files = list(pathlib.Path('app').rglob('*.py')); [ast.parse(open(f).read()) for f in files]; print(f'Syntax OK — {len(files)} files checked')"
